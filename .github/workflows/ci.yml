name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Executors that skip `uses:` actions (Flare) still get the pinned pnpm;
      # on GitHub, pnpm/action-setup already put it on PATH and this is a no-op.
      - name: Ensure pnpm
        run: |
          node --version
          if ! command -v pnpm >/dev/null 2>&1; then
            (corepack enable && corepack prepare pnpm@11.3.0 --activate) || npm install -g pnpm@11.3.0
          fi
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
