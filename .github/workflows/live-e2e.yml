name: Live Cloudflare E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: argus-live-e2e
  cancel-in-progress: false

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARGUS_API_URL: ${{ vars.ARGUS_API_URL }}
      ARGUS_E2E_TARGET: ${{ vars.ARGUS_E2E_TARGET }}
      ARGUS_E2E_TOKEN: ${{ secrets.ARGUS_E2E_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:live
